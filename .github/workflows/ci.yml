name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Keep jobs independent and cancellable so a new push on the same branch does
# not burn resources on stale runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Self-hosted on Soliso (label `eros`): jobs run on our own hardware with zero
# per-minute Actions billing. Python 3.14 + Node 26 are on PATH from the host
# (Arch), so we do NOT use actions/setup-python / setup-node here — they would
# try to download a prebuilt toolchain catalog that has no Arch entry.
jobs:
  verify:
    name: verify (python + docs)
    runs-on: [self-hosted, eros, python]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Python version
        run: python3 --version
      - name: Compile export_glb.py
        run: python3 -m py_compile scripts/export_glb.py
      - name: Enforce English-only reference docs
        run: |
          set -euo pipefail
          hits=$(grep -rEl 'à|è|é|ì|ò|ù|À|È|É|Ì|Ò|Ù' SKILL.md README.md CONTRIBUTING.md CREDITS.md references/ 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "Italian accent characters found in English-only docs:"
            echo "$hits"
            exit 1
          fi

  example-typecheck:
    name: example typecheck (nextjs-hero)
    runs-on: [self-hosted, eros, node]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: examples/nextjs-hero
    steps:
      - uses: actions/checkout@v4
      - name: Tool versions
        run: |
          node --version
          npm --version
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
