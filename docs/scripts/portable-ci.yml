# Portable CI workflow — runs on GitHub Actions OR Forgejo Actions unchanged.
# Copy as .github/workflows/ci.yml in any repo; adjust labels if needed.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    # GitHub-hosted: runs-on: ubuntu-latest
    # Self-hosted:  runs-on: [self-hosted, linux, x64, python]
    runs-on: [self-hosted, linux, x64, python]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile export_glb.py
        run: python3 -m py_compile scripts/export_glb.py
      - name: Enforce English-only reference docs
        run: |
          set -e
          hits=$(grep -rEl 'à|è|é|ì|ò|ù|À|È|É|Ì|Ò|Ù' SKILL.md README.md CONTRIBUTING.md CREDITS.md references/ 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "Italian accent characters found in English-only docs:"
            echo "$hits"
            exit 1
          fi
