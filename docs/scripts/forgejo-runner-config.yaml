# forgejo-runner config — labels + timeouts for one VPS serving every repo.
# Generated by: forgejo-runner generate-config, then edited.
log:
  level: info
runner:
  capacity: 2          # max 2 jobs concurrently on this VPS
  timeout: 15m           # hard cap so a stuck job never pins the host
  labels:
    - self-hosted       # always
    - linux             # always
    - x64               # platform
    - python            # python3 + uv installed
    - web               # node + chromium + playwright installed
    - blender           # headless Blender 5.x for export_glb.py
    - glibc             # glibc-based (Blender binary requirement)
cache:
  enabled: true
  dir: /data/cache
container:
  network: bridge
  options: -m 4g         # 4GB RAM cap per job container

# Register this runner:
#   forgejo-runner register --instance http://127.0.0.1:3000 --token <T> --labels self-hosted,linux,x64,python,web,blender,glibc
# Run:
#   forgejo-runner daemon
